<!DOCTYPE html>
<html>
<body style="background-color: #f3ece1; padding: 50px;">

  <!-- CSS Logo -->
  <div style="text-align: center; margin-bottom: 50px;">
    <div style="display: inline-block; position: relative;">
      <div style="position: absolute; top: 0; left: 10%; right: 10%; height: 10px; border-top: 2px solid #d1bfae; border-radius: 50%;"></div>
      <h1 style="font-family: 'Noto Serif Bengali', 'SolaimanLipi', serif; font-size: 42px; color: #7a1f1f; margin: 15px 0 0; font-weight: normal; letter-spacing: -1px; text-shadow: 1px 1px 0 rgba(255,255,255,0.5);">মহালয়া</h1>
      <div style="font-family: Arial, sans-serif; font-size: 10px; letter-spacing: 2.5px; color: #8e806c; text-transform: uppercase; margin-top: 5px;">Bangiya Samiti</div>
      <div style="position: absolute; bottom: -10px; left: 30%; right: 30%; height: 5px; border-bottom: 1px solid #d1bfae; border-radius: 50%;"></div>
    </div>
  </div>

  <!-- CSS Lotus -->
  <div style="text-align: center; margin-bottom: 50px;">
    <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
      <tr><td align="center" valign="middle">
        <div style="width: 80px; height: 1px; background-color: #eaddcc; display: inline-block; vertical-align: middle;"></div>
        <div style="display: inline-block; vertical-align: middle; margin: 0 10px; font-size: 0; line-height: 0;">
          <div style="display: inline-block; width: 14px; height: 14px; background-color: #7a1f1f; border-radius: 50% 0 50% 0; transform: rotate(45deg);"></div>
        </div>
        <div style="width: 80px; height: 1px; background-color: #eaddcc; display: inline-block; vertical-align: middle;"></div>
      </td></tr>
    </table>
  </div>

  <!-- CSS Hourglass -->
  <div style="text-align: center; margin-bottom: 50px;">
    <div style="display: inline-block; background-color: #f4ebd8; border-radius: 50%; width: 90px; height: 90px; position: relative;">
      <table border="0" cellpadding="0" cellspacing="0" style="width: 100%; height: 100%;">
        <tr><td align="center" valign="middle">
           <div style="width: 24px; border-top: 2px solid #8e806c; border-bottom: 2px solid #8e806c; padding: 2px 0;">
             <div style="width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid #c4b5a3; margin: 0 auto;"></div>
             <div style="width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 12px solid #8e806c; margin: 2px auto 0;"></div>
           </div>
        </td></tr>
      </table>
    </div>
  </div>

  <!-- CSS Banana/Food -->
  <div style="margin-bottom: 50px; text-align: right;">
    <div style="display: inline-block; position: relative; width: 160px; height: 80px;">
      <!-- Banana Leaf -->
      <div style="position: absolute; bottom: 0; right: 0; width: 140px; height: 60px; background-color: #4a5c43; border-radius: 50% 50% 0 50%; transform: rotate(-10deg); box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);"></div>
      <div style="position: absolute; bottom: 10px; right: 20px; width: 100px; height: 2px; background-color: rgba(255,255,255,0.1); transform: rotate(-15deg);"></div>
      <!-- Bowl -->
      <div style="position: absolute; bottom: 10px; right: 40px; width: 60px; height: 30px; background-color: #d1bfae; border-radius: 0 0 30px 30px; border-top: 3px solid #f4ebd8; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"></div>
      <!-- Food contents -->
      <div style="position: absolute; bottom: 35px; right: 50px; width: 40px; height: 15px; background-color: #fcf9f2; border-radius: 20px 20px 0 0;"></div>
      <!-- Dot -->
      <div style="position: absolute; bottom: 42px; right: 65px; width: 6px; height: 6px; background-color: #d14620; border-radius: 50%;"></div>
    </div>
  </div>

  <!-- CSS Alpona -->
  <div style="margin-bottom: 50px; text-align: left;">
    <div style="display: inline-block; position: relative; width: 150px; height: 150px; overflow: hidden;">
      <div style="position: absolute; bottom: -20px; left: -20px; width: 60px; height: 60px; border: 4px solid #eaddcc; border-radius: 50%;"></div>
      <div style="position: absolute; bottom: -40px; left: -40px; width: 120px; height: 120px; border: 2px solid #d1bfae; border-radius: 50%;"></div>
      <div style="position: absolute; bottom: -60px; left: -60px; width: 180px; height: 180px; border: 4px dotted #eaddcc; border-radius: 50%;"></div>
      
      <!-- Petals -->
      <div style="position: absolute; bottom: 20px; left: 15px; width: 20px; height: 20px; border-radius: 50% 0 50% 0; background-color: #f4ebd8; transform: rotate(15deg);"></div>
      <div style="position: absolute; bottom: 40px; left: 5px; width: 20px; height: 20px; border-radius: 50% 0 50% 0; background-color: #f4ebd8; transform: rotate(-30deg);"></div>
    </div>
  </div>

</body>
</html>
