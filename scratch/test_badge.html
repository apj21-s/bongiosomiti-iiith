<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tick Badge Test</title>
</head>
<body style="background-color: #fdfbf7; padding: 50px; font-family: Arial, sans-serif;">

  <!-- Exact Implementation of the Verified Tick Badge -->
  <!-- You can copy-paste this table directly into your email template -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center" valign="middle">
        
        <img 
          src="https://cdn.jsdelivr.net/gh/bangiyasamiti/mahalaya-email-assets/icons/tick.png" 
          alt="Verified" 
          width="48" 
          height="48" 
          style="display: block; border: none; width: 48px; height: 48px;"
        >

      </td>
    </tr>
    <!-- Optional Label below the tick -->
    <tr>
      <td align="center" valign="top" style="padding-top: 12px;">
        <p style="margin: 0; font-family: Arial, sans-serif; font-size: 16px; color: #3b7b15; font-weight: bold;">
          Payment Verified
        </p>
      </td>
    </tr>
  </table>

</body>
</html>
