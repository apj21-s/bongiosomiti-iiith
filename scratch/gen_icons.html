<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Favicon Generator</title>
</head>
<body>
  <div id="status">Processing logo.png...</div>
  <div id="output"></div>
  <script>
    window.generatedIcons = {};
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = "../assets/logo.png";
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const data = imgData.data;

      // Find alpha bounding box
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          const alpha = data[(y * c.width + x) * 4 + 3];
          if (alpha > 10) { // threshold for non-transparent pixel
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;
      const maxDim = Math.max(cropW, cropH);
      const pad = Math.round(maxDim * 0.06);
      const targetSq = maxDim + pad * 2;

      function createIconBase64(size) {
        const outCanvas = document.createElement("canvas");
        outCanvas.width = size;
        outCanvas.height = size;
        const outCtx = outCanvas.getContext("2d");
        outCtx.imageSmoothingEnabled = true;
        outCtx.imageSmoothingQuality = "high";

        // Calculate aspect-preserved scale and centering inside square canvas
        const scale = (size - (pad * 2 * size / targetSq)) / maxDim;
        const drawW = cropW * scale;
        const drawH = cropH * scale;
        const drawX = (size - drawW) / 2;
        const drawY = (size - drawH) / 2;

        outCtx.drawImage(c, minX, minY, cropW, cropH, drawX, drawY, drawW, drawH);
        return outCanvas.toDataURL("image/png");
      }

      const sizes = {
        "favicon-16x16.png": 16,
        "favicon-32x32.png": 32,
        "favicon-48x48.png": 48,
        "apple-touch-icon.png": 180,
        "android-chrome-192x192.png": 192
      };

      for (const [key, sz] of Object.entries(sizes)) {
        window.generatedIcons[key] = createIconBase64(sz);
      }

      document.getElementById("status").textContent = "DONE";
      document.getElementById("output").textContent = JSON.stringify(window.generatedIcons);
    };
    img.onerror = (e) => {
      document.getElementById("status").textContent = "ERROR: " + e;
    };
  </script>
</body>
</html>
